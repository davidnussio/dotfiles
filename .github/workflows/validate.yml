name: Validate dotfiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install validators
        run: brew install fish mise starship taplo zellij

      - name: Validate TOML configuration
        run: taplo check mise.toml config/mise/config.toml config/starship.toml config/topgrade.toml

      - name: Validate bootstrap packages
        # Resolves every formula and cask against Homebrew's API
        run: |
          mise trust mise.toml
          mise bootstrap packages status

      - name: Validate Fish
        run: fish -n config/fish/config.fish config/fish/conf.d/*.fish config/fish/functions/*.fish

      - name: Validate Starship and Zellij
        run: |
          STARSHIP_CONFIG="$PWD/config/starship.toml" starship explain
          XDG_CONFIG_HOME="$PWD/config" zellij setup --check
