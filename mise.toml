# Machine setup for macOS, applied with `mise bootstrap`.
#
#   mise bootstrap --dry-run      preview every change
#   mise bootstrap --prompt-vars  apply (asks for the git identity once)
#   mise bootstrap status         check this machine against the config
#
# Runtimes and dev tools live in the global config (config/mise/config.toml),
# which is linked into ~/.config/mise below.

# ─── Git identity (asked once per machine, never committed) ──────────────────
[vars.git_name]
default = "David Nussio"
prompt = "Git author name"

[vars.git_email]
default = ""
prompt = "Git email"

[vars.github_user]
default = "davidnussio"
prompt = "GitHub user"

# ─── Dotfiles → $HOME (symlinks) ─────────────────────────────────────────────
[dotfiles]
"~/.config/fish" = "config/fish"
"~/.config/mise" = "config/mise"
"~/.config/nvim" = "config/nvim"
"~/.config/zellij" = "config/zellij"
"~/.config/starship.toml" = "config/starship.toml"
"~/.config/topgrade.toml" = "config/topgrade.toml"
"~/.gitconfig" = "git/.gitconfig"
"~/.gitignore_global" = "git/.gitignore_global"
"~/Library/Application Support/com.mitchellh.ghostty/config" = "Application Support/com.mitchellh.ghostty/config"
"~/Library/Application Support/lazygit/config.yml" = "Application Support/lazygit/config.yml"
# Home/End move to line start/end in Cocoa text fields
"~/Library/KeyBindings/DefaultKeyBinding.dict" = { source = "macos/DefaultKeyBinding.dict", mode = "copy" }

# Package-manager cooldowns: skip releases younger than a day, when a
# compromised version is usually still unnoticed. Only these keys are managed;
# ~/.npmrc also holds registry tokens, so it gets a single line.
"~/.npmrc/min-release-age" = { line = "min-release-age=1" }
"~/.bunfig.toml/cooldown" = { source = "supply-chain/bunfig.toml", merge = true }
"~/.config/uv/uv.toml/cooldown" = { source = "supply-chain/uv.toml", merge = true }

# ─── Shell ───────────────────────────────────────────────────────────────────
# The activation block already lives in config/fish/config.fish
[bootstrap.mise_shell_activate]
fish = "auto"

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

# ─── macOS defaults ──────────────────────────────────────────────────────────
[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 25
press_and_hold = false
automatic_capitalization = false

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true
NSNavPanelExpandedStateForSaveMode = true
AppleKeyboardUIMode = 3 # full keyboard access in dialogs

[bootstrap.macos.defaults."com.apple.finder"]
FXDefaultSearchScope = "SCcf" # search the current folder

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = true # tap to click
TrackpadTwoFingerFromRightEdgeSwipeGesture = 0 # no Notification Center swipe

[bootstrap.macos.defaults."com.apple.dock"]
wvous-br-corner = 1 # no bottom-right hot corner
wvous-br-modifier = 0

[bootstrap.macos.defaults."digital.twisted.noTunes"]
replacement = "https://music.youtube.com/"

# Disable the F11 "Show Desktop" shortcut
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["36", "enabled"]
value = false

# ─── Setup the declarative parts do not cover (runs on every bootstrap) ──────
[tasks.bootstrap]
description = "Git identity, Screenshots folder, visible ~/Library"
run = [
  "git config -f ~/.gitconfig.local user.name '{{ vars.git_name }}'",
  "[ -z '{{ vars.git_email }}' ] || git config -f ~/.gitconfig.local user.email '{{ vars.git_email }}'",
  "git config -f ~/.gitconfig.local github.user '{{ vars.github_user }}'",
  "git config -f ~/.gitconfig.local credential.helper osxkeychain",
  "mkdir -p ~/Screenshots",
  "defaults write com.apple.screencapture location ~/Screenshots",
  "chflags nohidden ~/Library",
]

