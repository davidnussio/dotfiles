[tools]
java = "27"
bun = "latest"
node = "26"
python = "3.14"
uv = "latest"
"npm:@zvec/zvec-grep" = "latest"
maven = "latest"
# Homebrew taps without API metadata need Ruby 3 to evaluate, so these come from mise
"github:davidnussio/envsec" = "latest"
supabase = "latest"
tflint = "latest"

[settings]
verbose = false
experimental = true
lockfile = true
lockfile_platforms = ["macos-arm64", "macos-x64", "linux-x64"]
minimum_release_age = "1d"
# idiomatic_version_file_enable_tools = ["node"]
